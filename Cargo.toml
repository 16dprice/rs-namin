[package]
name = "rs-namin"
version = "0.1.0"
edition = "2024"
default-run = "rs-namin"

[dependencies]
egui-macroquad = "0.17.3"
image = { version = "0.25", default-features = false, features = ["png"] }
indicatif = "0.18.4"
inquire = "0.9.4"
lyon = "1.0"
macroquad = "0.4"
ttf-parser = "0.25"

[[bin]]
name = "rs-namin"
path = "src/main.rs"

[[bin]]
name = "export"
path = "src/bin/export.rs"

[[bin]]
name = "snapshot"
path = "src/bin/snapshot.rs"

[[bin]]
name = "example"
path = "src/bin/example.rs"
